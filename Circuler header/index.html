<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background: linear-gradient(135deg,#0f0c29,#302b63,#24243e);
    color:white;
    overflow-x:hidden;
}

/* NAVBAR */
nav{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.1);
    padding:10px 30px;
    border-radius:50px;
    display:flex;
    gap:30px;
    z-index:1000;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:14px;
}


footer{
    text-align:center;
    padding:20px;
    opacity:0.6;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Projects</a>
    <a href="#">Contact</a>
</nav>

<footer>
    © 2026 AI Portfolio | Built by You 🚀
</footer>

</body>
</html>
